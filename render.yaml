services:
  - type: web
    name: gfp-gestao-financeira
    runtime: static
    # A V2 atual é uma aplicação estática sem etapa de bundling na raiz.
    # Não executar npm ci aqui: não existe package.json nesse diretório.
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
