services:
  - type: web
    name: gfp-familiar-api
    runtime: node
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gfp-postgres
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://gfp-gestao-financeira.onrender.com
      - key: JWT_SECRET
        generateValue: true
