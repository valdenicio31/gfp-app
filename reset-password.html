<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GFP — Redefinir Senha</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #09090B; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .container { background: #18181B; border-radius: 16px; padding: 40px; max-width: 400px; width: 90%; }
    h1 { color: #7C3AED; margin-bottom: 8px; font-size: 24px; }
    p { color: #9CA3AF; margin-bottom: 24px; font-size: 14px; }
    label { display: block; font-size: 13px; color: #D4D4D8; margin: 12px 0 4px; }
    input { width: 100%; padding: 12px; border: 1px solid #27272A; background: #09090B; color: #fff; border-radius: 8px; font-size: 15px; }
    input:focus { outline: none; border-color: #7C3AED; }
    button { width: 100%; padding: 14px; background: #7C3AED; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; }
    button:hover { background: #6D28D9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; text-align: center; }
    .msg.ok { background: rgba(34,197,94,0.15); color: #22C55E; }
    .msg.err { background: rgba(239,68,68,0.15); color: #EF4444; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 Redefinir Senha</h1>
    <p>Digite sua nova senha (mínimo 10 caracteres).</p>
    <label>Nova senha</label>
    <input type="password" id="password" placeholder="••••••••••">
    <label>Confirmar senha</label>
    <input type="password" id="confirm" placeholder="••••••••••">
    <button id="btn" onclick="resetPassword()">Redefinir Senha</button>
    <div id="msg"></div>
  </div>
  <script>
    const API = 'https://gfp-familiar-api.onrender.com';
    const params = new URLSearchParams(location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('msg').innerHTML = '<div class="msg err">Token não encontrado na URL.</div>';
      document.getElementById('btn').disabled = true;
    }
    async function resetPassword() {
      const pwd = document.getElementById('password').value;
      const conf = document.getElementById('confirm').value;
      const msg = document.getElementById('msg');
      if (pwd.length < 10) { msg.innerHTML = '<div class="msg err">A senha deve ter no mínimo 10 caracteres.</div>'; return; }
      if (pwd !== conf) { msg.innerHTML = '<div class="msg err">As senhas não coincidem.</div>'; return; }
      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Redefinindo...';
      try {
        const res = await fetch(`${API}/auth/confirm-password-reset`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pwd })
        });
        const data = await res.json();
        if (res.ok) { msg.innerHTML = '<div class="msg ok">✅ Senha redefinida! Redirecionando...</div>'; setTimeout(() => location.href = 'https://gfp-app.onrender.com', 3000); }
        else { msg.innerHTML = `<div class="msg err">${data.error || 'Erro'}</div>`; btn.disabled = false; btn.textContent = 'Redefinir Senha'; }
      } catch (e) { msg.innerHTML = '<div class="msg err">Erro de conexão.</div>'; btn.disabled = false; btn.textContent = 'Redefinir Senha'; }
    }
  </script>
</body>
</html>
